<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TXG Security Verification</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #18233d 0%, #080b12 45%, #05070b 100%);
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(18, 23, 34, 0.94);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: auto;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#252d40,#111723);
      border: 1px solid rgba(255,255,255,.1);
      font-size: 32px;
    }

    h1 {
      margin-top: 22px;
      font-size: 25px;
    }

    .sub {
      margin-top: 10px;
      color: #9ca7ba;
      font-size: 14px;
      line-height: 1.6;
    }

    .status {
      margin-top: 28px;
      padding: 18px;
      border-radius: 16px;
      background: rgba(255,255,255,.04);
      color: #cbd5e1;
      font-size: 14px;
    }

    .loader {
      width: 38px;
      height: 38px;
      margin: 0 auto 14px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .success {
      color: #7df2a8;
      font-size: 18px;
      font-weight: bold;
    }

    .warning {
      color: #ffd166;
      font-size: 18px;
      font-weight: bold;
    }

    .danger {
      color: #ff7777;
      font-size: 18px;
      font-weight: bold;
    }

    .footer {
      margin-top: 24px;
      color: #687386;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">TXG</div>

    <h1>Security Verification</h1>

    <div class="sub">
      Please wait while your verification is being processed.
    </div>

    <div class="status" id="statusBox">
      <div class="loader"></div>
      <div id="statusText">Starting verification...</div>
    </div>

    <div class="footer">
      Powered by #TXG
    </div>

  </div>

<script>

const params = new URLSearchParams(window.location.search);

const botHash = params.get("bot_hash");
const bot = params.get("bot");

const statusBox = document.getElementById("statusBox");
const statusText = document.getElementById("statusText");

function showResult(type, message) {

  statusBox.innerHTML = "";

  const text = document.createElement("div");

  if (type === "verified") {
    text.className = "success";
  }

  if (type === "same_device") {
    text.className = "warning";
  }

  if (type === "vpn") {
    text.className = "danger";
  }

  text.textContent = message;

  statusBox.appendChild(text);
}

async function startVerification() {

  if (!botHash) {
    showResult("vpn", "Invalid verification session");
    return;
  }

  statusText.textContent = "Checking verification session...";

  /*
    IMPORTANT:

    Put your real verification API here.

    The API should return something like:

    {
      "status": "verified"
    }

    OR

    {
      "status": "same_device"
    }

    OR

    {
      "status": "vpn"
    }
  */

  try {

    // Example:
    //
    // const response = await fetch(
    //   "/api/verify?bot_hash=" + encodeURIComponent(botHash)
    // );
    //
    // const result = await response.json();

    /*
      DEMO ONLY

      Remove this demo section when your real
      verification backend is connected.
    */

    setTimeout(() => {

      showResult(
        "verified",
        "Verification Successful"
      );

    }, 2000);

  } catch (error) {

    showResult(
      "vpn",
      "Verification could not be completed"
    );

  }
}

startVerification();

</script>

</body>
</html>
